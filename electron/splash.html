<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    -webkit-app-region: drag;
    user-select: none;
  }
  .card {
    background: #0d1117;
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 32px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }
  .logo-main {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #3b82f6;
  }
  .logo-sub {
    font-size: 12px;
    letter-spacing: 4px;
    color: #475569;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .loader {
    margin-top: 24px;
    height: 3px;
    background: #1e293b;
    border-radius: 2px;
    overflow: hidden;
  }
  .loader-bar {
    height: 100%;
    background: #3b82f6;
    animation: load 1.1s ease-in-out infinite;
    border-radius: 2px;
  }
  @keyframes load {
    0%   { width: 0%;   margin-left: 0%; }
    50%  { width: 60%;  margin-left: 20%; }
    100% { width: 0%;   margin-left: 100%; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-main">IPTV</div>
    <div class="logo-sub">Player</div>
    <div class="loader"><div class="loader-bar"></div></div>
  </div>
</body>
</html>
