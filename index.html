<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Player</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0c0f" id="meta-theme">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
  <!-- Anti-FOUT : restore theme before paint -->
  <script>
    // Always default to dark theme (no localStorage persistence)
    document.documentElement.setAttribute('data-theme', 'dark');
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js" defer></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/parser.js" defer></script>
  <script src="js/player.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/app.js" defer></script>
</head>

<body>
  <div id="app">

    <!-- TOP BAR -->
    <header id="topbar">
      <button id="sidebar-toggle" onclick="toggleSidebar()" data-nav aria-label="Menu">
        <i data-lucide="menu"></i>
      </button>
      <div id="logo">
        <i data-lucide="tv"></i>
        <span>IPTV <small>PLAYER</small></span>
      </div>
      <div id="search-wrap">
        <i data-lucide="search"></i>
        <input type="text" id="search" data-i18n-placeholder="search_placeholder" oninput="App.filterChannels()"
          data-nav autocomplete="off">
      </div>
      <nav id="topbar-right">
        <button class="tab-btn active" data-tab="all" onclick="App.switchTab('all',this)" data-nav>
          <i data-lucide="layout-grid"></i>
          <span data-i18n="all">Tous</span>
        </button>
        <button class="tab-btn" data-tab="fav" onclick="App.switchTab('fav',this)" data-nav>
          <i data-lucide="star"></i>
          <span data-i18n="fav">Favoris</span>
        </button>
        <button class="tab-btn" data-tab="hist" onclick="App.switchTab('hist',this)" data-nav>
          <i data-lucide="clock"></i>
          <span data-i18n="hist">Historique</span>
        </button>
        <button class="icon-btn" id="theme-toggle" onclick="ThemeManager.toggle()" data-nav title="Changer de thème"
          aria-label="Basculer thème clair/sombre">
          <span id="theme-icon">🌙</span>
        </button>
        <button id="load-btn" onclick="openModal()" data-nav>
          <i data-lucide="plus-circle"></i>
          <span data-i18n="load">Charger</span>
        </button>
      </nav>
    </header>

    <!-- MAIN -->
    <main id="main">
      <div id="sidebar-overlay" onclick="closeSidebar()"></div>

      <!-- SIDEBAR -->
      <aside id="sidebar">
        <div id="mobile-tabs">
          <button class="tab-btn active" data-tab="all" onclick="App.switchTab('all',this)" data-nav>
            <i data-lucide="layout-grid"></i>
          </button>
          <button class="tab-btn" data-tab="fav" onclick="App.switchTab('fav',this)" data-nav>
            <i data-lucide="star"></i>
          </button>
          <button class="tab-btn" data-tab="hist" onclick="App.switchTab('hist',this)" data-nav>
            <i data-lucide="clock"></i>
          </button>
        </div>
        <div id="cats-wrap">
          <button id="cats-prev" class="cats-arrow" aria-label="Categories precedentes">‹</button>
          <div id="cats"></div>
          <button id="cats-next" class="cats-arrow" aria-label="Categories suivantes">›</button>
        </div>
        <div id="ch-list">
          <div id="no-ch">
            <i data-lucide="tv-2"></i>
            <p data-i18n="no_channels">Aucune chaine chargee.<br>Clique sur <b>Charger</b>.</p>
          </div>
        </div>
      </aside>

      <!-- PLAYER -->
      <section id="player-area">
        <div id="video-wrap">
          <video id="video" playsinline></video>
          <div id="overlay">
            <i data-lucide="play-circle" id="overlay-icon"></i>
            <div id="overlay-text" data-i18n="no_channel_selected">Aucune chaine selectionnee</div>
            <div id="overlay-sub" data-i18n="load_playlist_hint">Charge ta playlist M3U et choisis une chaine</div>
          </div>
          <div id="player-stats"></div>
          <div id="status-bar"></div>
        </div>
        <div id="now-playing" hidden>
          <img id="np-logo" src="" alt="">
          <div id="np-info">
            <div id="np-name">—</div>
            <div id="np-group">—</div>
          </div>
          <div id="np-live" data-i18n="live">LIVE</div>
        </div>
        <div id="controls">
          <button class="ctrl-btn" onclick="Player.prev()" data-nav title="Precedent">
            <i data-lucide="skip-back"></i>
            <span data-i18n="prev">Prec</span>
          </button>
          <button class="ctrl-btn" onclick="Player.next()" data-nav title="Suivant">
            <span data-i18n="next">Suiv</span>
            <i data-lucide="skip-forward"></i>
          </button>
          <div id="vol-wrap">
            <button id="vol-icon" onclick="Player.toggleMute()" data-nav aria-label="Mute">
              <i data-lucide="volume-2"></i>
            </button>
            <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1"
              oninput="Player.setVolume(this.value)" data-nav>
          </div>
          <button class="ctrl-btn" onclick="Player.toggleFullscreen()" data-nav>
            <i data-lucide="maximize"></i>
            <span data-i18n="fullscreen">Plein ecran</span>
          </button>
          <button class="ctrl-btn danger" onclick="Player.stop()" data-nav>
            <i data-lucide="square"></i>
            <span data-i18n="stop">Stop</span>
          </button>
          <div id="url-bar">
            <input type="text" id="url-input" data-i18n-placeholder="url_placeholder" data-nav>
          </div>
          <button class="ctrl-btn" onclick="Player.togglePiP()" data-nav title="Picture-in-Picture">
            <i data-lucide="picture-in-picture-2"></i>
          </button>
          <button class="ctrl-btn" onclick="Player.captureFrame()" data-nav title="Capture d ecran">
            <i data-lucide="camera"></i>
          </button>
          <button class="ctrl-btn" onclick="App.exportFavorites()" data-nav title="Exporter favoris">
            <i data-lucide="download"></i>
          </button>
          <button class="ctrl-btn" onclick="Player.toggleStats()" data-nav title="Stats flux">
            <i data-lucide="activity"></i>
          </button>
          <button class="ctrl-btn" onclick="Player.playUrl()" data-nav>
            <i data-lucide="play"></i>
            <span data-i18n="play_url">Lire URL</span>
          </button>
        </div>
      </section>
    </main>
  </div>
