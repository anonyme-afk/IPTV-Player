<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Player</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js" defer></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/parser.js" defer></script>
  <script src="js/player.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <header id="topbar">
    <button id="sidebar-toggle" onclick="toggleSidebar()" data-nav aria-label="Menu">
      <i data-lucide="menu"></i>
    </button>
    <div id="logo">
      <i data-lucide="tv"></i>
      <span>IPTV <small>PLAYER</small></span>
    </div>
    <div id="search-wrap">
      <i data-lucide="search"></i>
      <input type="text" id="search" data-i18n-placeholder="search_placeholder" oninput="App.filterChannels()" data-nav autocomplete="off">
    </div>
    <nav id="topbar-right">
      <button class="tab-btn active" data-tab="all" onclick="App.switchTab('all',this)" data-nav>
        <i data-lucide="layout-grid"></i>
        <span data-i18n="all">Tous</span>
      </button>
      <button class="tab-btn" data-tab="fav" onclick="App.switchTab('fav',this)" data-nav>
        <i data-lucide="star"></i>
        <span data-i18n="fav">Favoris</span>
      </button>
      <button class="tab-btn" data-tab="hist" onclick="App.switchTab('hist',this)" data-nav>
        <i data-lucide="clock"></i>
        <span data-i18n="hist">Historique</span>
      </button>
      <button id="load-btn" onclick="openModal()" data-nav>
        <i data-lucide="plus-circle"></i>
        <span data-i18n="load">Charger</span>
      </button>
    </nav>
  </header>

  <!-- MAIN -->
  <main id="main">

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar">
      <!-- Mobile tabs inside sidebar -->
      <div id="mobile-tabs">
        <button class="tab-btn active" data-tab="all" onclick="App.switchTab('all',this)" data-nav>
          <i data-lucide="layout-grid"></i>
        </button>
        <button class="tab-btn" data-tab="fav" onclick="App.switchTab('fav',this)" data-nav>
          <i data-lucide="star"></i>
        </button>
        <button class="tab-btn" data-tab="hist" onclick="App.switchTab('hist',this)" data-nav>
          <i data-lucide="clock"></i>
        </button>
      </div>
      <div id="cats"></div>
      <div id="ch-list">
        <div id="no-ch">
          <i data-lucide="tv-2"></i>
          <p data-i18n="no_channels">Aucune chaîne chargée.<br>Clique sur <b>Charger</b>.</p>
        </div>
      </div>
    </aside>

    <!-- PLAYER -->
    <section id="player-area">
      <div id="video-wrap">
        <video id="video" playsinline></video>
        <div id="overlay">
          <i data-lucide="play-circle" id="overlay-icon"></i>
          <div id="overlay-text" data-i18n="no_channel_selected">Aucune chaîne sélectionnée</div>
          <div id="overlay-sub" data-i18n="load_playlist_hint">Charge ta playlist M3U et choisis une chaîne</div>
        </div>
        <div id="status-bar"></div>
      </div>

      <div id="now-playing" hidden>
        <img id="np-logo" src="" alt="">
        <div id="np-info">
          <div id="np-name">—</div>
          <div id="np-group">—</div>
        </div>
        <div id="np-live" data-i18n="live">LIVE</div>
      </div>

      <div id="controls">
        <button class="ctrl-btn" onclick="Player.prev()" data-nav title="Précédent">
          <i data-lucide="skip-back"></i>
          <span data-i18n="prev">Préc</span>
        </button>
        <button class="ctrl-btn" onclick="Player.next()" data-nav title="Suivant">
          <span data-i18n="next">Suiv</span>
          <i data-lucide="skip-forward"></i>
        </button>
        <div id="vol-wrap">
          <button id="vol-icon" onclick="Player.toggleMute()" data-nav aria-label="Mute">
            <i data-lucide="volume-2"></i>
          </button>
          <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1"
                 oninput="Player.setVolume(this.value)" data-nav>
        </div>
        <button class="ctrl-btn" onclick="Player.toggleFullscreen()" data-nav>
          <i data-lucide="maximize"></i>
          <span data-i18n="fullscreen">Plein écran</span>
        </button>
        <button class="ctrl-btn danger" onclick="Player.stop()" data-nav>
          <i data-lucide="square"></i>
          <span data-i18n="stop">Stop</span>
        </button>
        <div id="url-bar">
          <input type="text" id="url-input" data-i18n-placeholder="url_placeholder" data-nav>
        </div>
        <button class="ctrl-btn" onclick="Player.playUrl()" data-nav>
          <i data-lucide="play"></i>
          <span data-i18n="play_url">Lire URL</span>
        </button>
      </div>
    </section>

  </main>
</div>

<!-- MODAL -->
<div id="modal-bg" role="dialog" aria-modal="true">
  <div id="modal">
    <h2>
      <i data-lucide="folder-open"></i>
      <span data-i18n="modal_title">Charger une playlist</span>
    </h2>
    <div id="modal-tabs">
      <button class="m-tab active" data-modal-tab="url" onclick="switchModalTab('url',this)" data-nav>URL</button>
      <button class="m-tab" data-modal-tab="file" onclick="switchModalTab('file',this)" data-nav data-i18n="tab_file">Fichier</button>
      <button class="m-tab" data-modal-tab="text" onclick="switchModalTab('text',this)" data-nav data-i18n="tab_text">Texte</button>
    </div>
    <div id="mtab-url" class="modal-panel">
      <label data-i18n="label_url">URL M3U/M3U8</label>
      <input type="url" id="m3u-url" placeholder="https://..." data-nav>
      <small data-i18n="github_hint">GitHub : utilise le lien <b>Raw</b>.</small>
    </div>
    <div id="mtab-file" class="modal-panel" hidden>
      <label data-i18n="label_file">Fichier local .m3u/.m3u8</label>
      <input type="file" id="m3u-file" accept=".m3u,.m3u8,.txt" data-nav>
    </div>
    <div id="mtab-text" class="modal-panel" hidden>
      <label data-i18n="label_text">Contenu M3U</label>
      <textarea id="m3u-text" placeholder="#EXTM3U&#10;#EXTINF:-1,Ma Chaîne&#10;http://..." data-nav></textarea>
    </div>
    <div id="modal-btns">
      <button class="m-btn secondary" onclick="closeModal()" data-nav data-i18n="cancel">Annuler</button>
      <button class="m-btn primary" onclick="App.loadM3U()" data-nav>
        <span data-i18n="load_btn">Charger</span>
        <i data-lucide="arrow-right-circle"></i>
      </button>
    </div>
  </div>
</div>

</body>
</html>
